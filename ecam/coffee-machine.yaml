# DeLonghi Eletta Explore (ECAM v2.1) controlled over the mainboard UART by an M5Stack Atom Lite
# that replaces the stock Wi-Fi module. Wiring (mainboard J8, 2.0 mm; pins as on the module J1A):
#   J1-4 3V3 -> Atom 3V3     J1-8 GND -> Atom GND
#   J1-5 machine TX -> G19   J1-6 machine RX <- G22
# Shared package: include it from a per-site device file (see example.yaml) and keep local
# overrides there. The site file sets ecam_repo / ecam_ref; this package pulls the component
# from the same repo, so an update is a push plus Install.
# Settings, names and counters are read when the machine comes online, after a drink, after a write
# and on standby. The periodic read only catches changes made on the machine's own display; set
# ecam_poll_interval in the site file (e.g. 60s, or 24h to all but switch it off).
substitutions:
  ecam_poll_interval: 10min

esphome:
  name: ${name}
  friendly_name: Coffee

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: ${ecam_repo}
      ref: ${ecam_ref}
    components: [ecam]
    refresh: ${ecam_refresh}

logger:
  baud_rate: 0          # UART0 is free; keep the log off the serial pins
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    encryption: {}      # Noise-encrypted OTA with the api key; plain OTA would accept any flasher on the LAN

api:
  encryption:
    key: !secret api_key
  actions:
    # drink: id (1 espresso, 3 long/filter style, 6 americano, 0x0a flat white, 0x10 hot water, 0x16 tea, ...)
    # 0 / negative = keep the stored recipe value; temp -1 = not sent, 0..3 low..max
    # Any value given sends the stored recipe with it (as the app does; milk drinks need that).
    - action: brew
      variables:
        drink: int
        coffee_ml: int
        water_ml: int
        milk_s: float
        strength: int
        temp: int
      then:
        - lambda: 'id(machine).brew(drink, coffee_ml, water_ml, milk_s, strength, temp);'
    # Stored recipes. drink: name ("flat white") or hex id ("0a"); profile 0 = active. The text goes to
    # the Recipe sensor. save_recipe changes the given values of the active profile's recipe and keeps
    # the rest (0 / negative = keep, temp -1 = keep).
    - action: read_recipe
      variables:
        drink: string
        profile: int
      then:
        - lambda: 'id(machine).read_recipe(ecam::Ecam::drink_id(drink), profile);'
    - action: save_recipe
      variables:
        drink: string
        coffee_ml: int
        water_ml: int
        milk_s: float
        strength: int
        temp: int
      then:
        - lambda: 'id(machine).save_recipe(ecam::Ecam::drink_id(drink), coffee_ml, water_ml, milk_s, strength, temp);'
    # Favourites of the active profile: comma-separated names or hex ids, newest first, max 11; "" clears.
    - action: set_favorites
      variables:
        drinks: string
      then:
        - lambda: 'id(machine).set_favorites(drinks);'
    # Removes custom drink slot 1..6 (drinks e6..eb) from the machine menu.
    - action: delete_custom_drink
      variables:
        slot: int
      then:
        - lambda: 'id(machine).delete_custom_drink(slot);'
    - action: select_bean_adapt
      variables:
        slot: int
      then:
        - lambda: 'id(machine).select_bean_adapt(slot);'
    # Every statistics counter as {id: value}, returned to the caller (and logged at INFO).
    - action: dump_counters
      supports_response: only
      then:
        - lambda: 'id(machine).dump_counters();'
        - api.respond:
            data: !lambda |-
              for (auto &kv : id(machine).counters()) root[to_string(kv.first)] = kv.second;
    # Exploration: read PAR start .. start+count-1 in the background (reads only, ~20 ms each), then
    # fetch the non-zero values with scan_result.
    - action: scan_params
      variables:
        start: int
        count: int
      then:
        - lambda: 'id(machine).scan_params(start, count);'
    - action: scan_result
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              root["done"] = id(machine).scan_done();
              root["answered"] = id(machine).scan_answered();
              root["next"] = id(machine).scan_next();
              JsonObject values = root["values"].to<JsonObject>();
              for (auto &kv : id(machine).scan_results()) values[to_string(kv.first)] = kv.second;
    # The answer to the last raw action: {"raw": "<tx> -> <rx>"}.
    - action: raw_result
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              root["raw"] = id(machine).last_raw();
    # Debug: send a raw ECAM payload (hex, without 0D/len/CRC); the answer goes to the log at INFO.
    - action: raw
      variables:
        payload: string
      then:
        - lambda: 'id(machine).raw(payload);'

# The machine's clock (autostart, display) follows Home Assistant's time: on every sync, when the
# machine comes online, and hourly. Machines without a clock (alarm bit 26 set, E2 refused or not
# answered) get no more syncs until the ESP restarts.
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: sync_clock
    on_time:
      - seconds: 0
        minutes: 0
        then:
          - script.execute: sync_clock

uart:
  id: mainboard
  tx_pin: GPIO22
  rx_pin: GPIO19
  baud_rate: 115200

ecam:
  id: machine
  uart_id: mainboard
  wifi_icon: auto        # real wifi / HA state on the machine display; or a fixed 0x30..0x36

button:
  - platform: restart
    name: Restart
    entity_category: config
  - platform: template
    name: Power on
    icon: mdi:power
    on_press:
      - lambda: 'id(machine).power_on();'
  - platform: template
    name: Standby
    icon: mdi:power-sleep
    on_press:
      - lambda: 'id(machine).power_off();'
  - platform: template
    name: Stop
    icon: mdi:stop
    on_press:
      - lambda: 'id(machine).stop();'
  - platform: template
    name: Filter style 330
    icon: mdi:coffee
    on_press:
      - lambda: 'id(machine).brew(0x03, 330, 0, 0, 4, -1);'
  - platform: template
    name: Espresso
    icon: mdi:coffee-outline
    on_press:
      - lambda: 'id(machine).brew(0x01, 0, 0, 0, 0, -1);'
  # Skips the rinse the machine runs before the drink started from here (the app's "skip rinse", tag 27).
  # Not the rinse after power-on: on an ECAM450.65.G that one runs to the end regardless.
  - platform: template
    name: Skip rinse
    icon: mdi:debug-step-over
    on_press:
      - lambda: 'id(machine).skip_rinse();'
  - platform: template
    name: Save recipe
    icon: mdi:content-save
    on_press:
      - lambda: 'id(machine).save_recipe_edits();'
  - platform: template
    name: Reload recipe
    icon: mdi:reload
    on_press:
      - lambda: 'id(machine).read_recipe(ecam::Ecam::drink_id(std::string(id(drink).current_option())), 0);'
  - platform: template
    name: Save bean
    icon: mdi:content-save
    on_press:
      - lambda: 'id(machine).save_bean();'
  - platform: template
    name: Delete bean
    icon: mdi:delete
    on_press:
      - lambda: 'id(machine).delete_bean();'
  # The drink chosen in "Drink", with the active profile's stored recipe.
  - platform: template
    name: Brew drink
    icon: mdi:coffee-maker-outline
    on_press:
      - lambda: 'id(machine).brew(ecam::Ecam::drink_id(std::string(id(drink).current_option())), 0, 0, 0, 0, -1);'
  # The drink shown in the recipe editor with its unsaved changes, once; the stored recipe stays.
  - platform: template
    name: Brew with changes
    icon: mdi:coffee-maker-check-outline
    on_press:
      - lambda: 'id(machine).brew_recipe_edits();'

# Settings (PAR 50, 61-65), including the ones the app hides for this model. Bit flags are written
# read-modify-write, so one switch never changes another setting.
select:
  # Bean Adapt editor: "Bean slot" loads a slot into the Bean entities, "Save bean" writes it.
  - platform: template
    name: Bean slot
    icon: mdi:seed-outline
    update_interval: 1s
    options: ["1", "2", "3", "4", "5", "6"]
    lambda: 'return to_string(id(machine).bean_edit_slot());'
    set_action:
      - lambda: 'id(machine).edit_bean(atoi(x.c_str()));'
  - platform: template
    name: Bean temperature
    icon: mdi:thermometer
    update_interval: 1s
    options: [low, mid, high, very high]
    lambda: 'return id(machine).bean_temperature();'
    set_action:
      - lambda: 'id(machine).set_bean_temperature(x);'
  - platform: template
    name: Bean aroma
    icon: mdi:scent
    update_interval: 1s
    options: [pre-ground, extra mild, mild, normal, strong, extra strong]
    lambda: 'return id(machine).bean_aroma();'
    set_action:
      - lambda: 'id(machine).set_bean_aroma(x);'
  - platform: template
    id: drink
    name: Drink
    icon: mdi:coffee
    optimistic: true
    restore_value: true
    # Choosing a drink loads its stored recipe (active profile) into the Recipe entities.
    on_value:
      - lambda: 'id(machine).read_recipe(ecam::Ecam::drink_id(x), 0);'
    options:
      - espresso
      - coffee
      - long coffee
      - 2x espresso
      - doppio+
      - americano
      - cappuccino
      - latte macchiato
      - caffelatte
      - flat white
      - espresso macchiato
      - hot milk
      - cappuccino doppio+
      - cappuccino reverse
      - hot water
      - tea
      - coffee pot
      - cortado
      - brew over ice
      - iced americano
      - iced cappuccino
      - iced latte macchiato
      - iced cappuccino mix
      - iced flat white
      - iced cold milk
      - iced caffelatte
      - mug americano
      - mug cappuccino
      - mug latte macchiato
      - mug caffelatte
      - mug cappuccino mix
      - mug flat white
      - mug hot milk
      - mug brew over ice
      - mug iced americano
      - mug iced cappuccino
      - mug iced latte macchiato
      - mug iced caffelatte
      - mug iced cappuccino mix
      - mug iced flat white
      - mug iced cold milk
      - bean adapt espresso
      - custom 1
      - custom 2
      - custom 3
      - custom 4
      - custom 5
      - custom 6
  - platform: template
    name: Active profile
    icon: mdi:account
    options: ["1", "2", "3", "4"]
    update_interval: 5s
    lambda: |-
      uint8_t p = id(machine).active_profile();
      if (!id(machine).has_status() || p == 0) return {};
      return to_string(p);
    set_action:
      - lambda: 'id(machine).select_profile(atoi(std::string(x).c_str()));'
      - delay: 1s
      - lambda: 'id(machine).read_recipe(ecam::Ecam::drink_id(std::string(id(drink).current_option())), 0);'
  # Recipe editor for the drink in "Drink": changes are kept here until "Save recipe".
  - platform: template
    name: Recipe strength
    icon: mdi:coffee-outline
    options: [pre-ground, 1 extra light, 2 light, 3 medium, 4 strong, 5 extra strong]
    update_interval: 1s
    lambda: |-
      static const char *const o[] = {"pre-ground", "1 extra light", "2 light", "3 medium", "4 strong", "5 extra strong"};
      auto v = id(machine).recipe_value(0x02);
      if (!v || *v > 5) return {};
      return std::string(o[*v]);
    set_action:
      - lambda: |-
          std::string s(x);
          id(machine).set_recipe_value(0x02, s == "pre-ground" ? 0 : atoi(s.c_str()));
  - platform: template
    name: Recipe water temperature
    icon: mdi:thermometer-water
    options: [low, medium, high, max]
    update_interval: 1s
    lambda: |-
      static const char *const o[] = {"low", "medium", "high", "max"};
      auto v = id(machine).recipe_value(0x0D);
      if (!v || *v > 3) return {};
      return std::string(o[*v]);
    set_action:
      - lambda: |-
          static const char *const o[] = {"low", "medium", "high", "max"};
          for (int i = 0; i < 4; i++) if (std::string(x) == o[i]) id(machine).set_recipe_value(0x0D, i);
  - platform: template
    name: Coffee temperature
    icon: mdi:thermometer
    entity_category: config
    options: [low, medium, high]
    update_interval: 5s
    lambda: |-
      static const char *const o[] = {"low", "medium", "high"};
      auto v = id(machine).param(61);
      if (!v || *v > 2) return {};
      return std::string(o[*v]);
    set_action:
      - lambda: |-
          static const char *const o[] = {"low", "medium", "high"};
          for (int i = 0; i < 3; i++) if (std::string(x) == o[i]) id(machine).write_param(61, i);
  - platform: template
    name: Auto-off
    icon: mdi:timer-off-outline
    entity_category: config
    options: [15 min, 30 min, 1 h, 3 h]
    update_interval: 5s
    lambda: |-
      static const char *const o[] = {"15 min", "30 min", "1 h", "3 h"};
      auto v = id(machine).param(62);
      if (!v || *v > 3) return {};
      return std::string(o[*v]);
    set_action:
      - lambda: |-
          static const char *const o[] = {"15 min", "30 min", "1 h", "3 h"};
          for (int i = 0; i < 4; i++) if (std::string(x) == o[i]) id(machine).write_param(62, i);
  # PAR 50 holds level - 1.
  - platform: template
    name: Water hardness
    icon: mdi:water-opacity
    entity_category: config
    options: ["1", "2", "3", "4"]
    update_interval: 5s
    lambda: |-
      auto v = id(machine).param(50);
      if (!v || *v > 3) return {};
      return to_string(*v + 1);
    set_action:
      - lambda: |-
          int level = atoi(std::string(x).c_str());
          if (level >= 1 && level <= 4) id(machine).write_param(50, level - 1);

# PAR 63 flags: bit 0 autostart OFF, 1 12-hour clock, 2 key beep, 3 cup light, 4 energy saving, 7 water filter.
# restore_mode DISABLED: the default ALWAYS_OFF runs turn_off_action at boot and would clear every flag
# on the machine (and with the filter flag the machine also resets PAR 109) whenever the ESP restarts.
switch:
  - platform: template
    name: Autostart
    icon: mdi:alarm
    entity_category: config
    restore_mode: DISABLED
    lambda: |-
      auto off = id(machine).param_bit(63, 0x01);
      if (!off) return {};
      return !*off;
    turn_on_action:
      - lambda: 'id(machine).write_param_bits(63, 0x01, false);'
    turn_off_action:
      - lambda: 'id(machine).write_param_bits(63, 0x01, true);'
  - platform: template
    name: 12-hour clock
    icon: mdi:clock-outline
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(machine).param_bit(63, 0x02);'
    turn_on_action:
      - lambda: 'id(machine).write_param_bits(63, 0x02, true);'
    turn_off_action:
      - lambda: 'id(machine).write_param_bits(63, 0x02, false);'
  - platform: template
    name: Key beep
    icon: mdi:volume-high
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(machine).param_bit(63, 0x04);'
    turn_on_action:
      - lambda: 'id(machine).write_param_bits(63, 0x04, true);'
    turn_off_action:
      - lambda: 'id(machine).write_param_bits(63, 0x04, false);'
  - platform: template
    name: Cup light
    icon: mdi:lightbulb-outline
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(machine).param_bit(63, 0x08);'
    turn_on_action:
      - lambda: 'id(machine).write_param_bits(63, 0x08, true);'
    turn_off_action:
      - lambda: 'id(machine).write_param_bits(63, 0x08, false);'
  - platform: template
    name: Energy saving
    icon: mdi:leaf
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(machine).param_bit(63, 0x10);'
    turn_on_action:
      - lambda: 'id(machine).write_param_bits(63, 0x10, true);'
    turn_off_action:
      - lambda: 'id(machine).write_param_bits(63, 0x10, false);'
  - platform: template
    name: Water filter
    icon: mdi:filter-outline
    entity_category: config
    restore_mode: DISABLED
    lambda: 'return id(machine).param_bit(63, 0x80);'
    turn_on_action:
      - lambda: 'id(machine).write_param_bits(63, 0x80, true);'
    turn_off_action:
      - lambda: 'id(machine).write_param_bits(63, 0x80, false);'

number:
  - platform: template
    name: Bean grind
    icon: mdi:grain
    mode: slider
    min_value: 1
    max_value: 7
    step: 0.5
    update_interval: 1s
    lambda: 'return id(machine).bean_grind();'
    set_action:
      - lambda: 'id(machine).set_bean_grind(x);'
  # More recipe values (the app's ingredient enum); a drink without the value shows unknown, the
  # range of each is in "Recipe limits".
  - platform: template
    name: Recipe froth
    icon: mdi:waves
    mode: box
    min_value: 0
    max_value: 255
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x0B);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x0B, (uint16_t) x);'
  - platform: template
    name: Recipe milk temperature
    icon: mdi:thermometer
    mode: box
    min_value: 0
    max_value: 255
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x0A);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x0A, (uint16_t) x);'
  - platform: template
    name: Recipe inversion
    icon: mdi:swap-vertical
    mode: box
    min_value: 0
    max_value: 255
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x0C);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x0C, (uint16_t) x);'
  - platform: template
    name: Recipe mug size
    icon: mdi:cup
    mode: box
    min_value: 0
    max_value: 255
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x20);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x20, (uint16_t) x);'
  - platform: template
    name: Recipe ice cubes
    icon: mdi:cube-outline
    mode: box
    min_value: 0
    max_value: 255
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x25);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x25, (uint16_t) x);'
  - platform: template
    name: Recipe intensity
    icon: mdi:gauge
    mode: box
    min_value: 0
    max_value: 255
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x26);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x26, (uint16_t) x);'
  - platform: template
    name: Recipe coffee
    icon: mdi:coffee
    unit_of_measurement: ml
    mode: box
    min_value: 0
    max_value: 500
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x01);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x01, (uint16_t) x);'
  - platform: template
    name: Recipe water
    icon: mdi:water
    unit_of_measurement: ml
    mode: box
    min_value: 0
    max_value: 500
    step: 1
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x0F);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x0F, (uint16_t) x);'
  - platform: template
    name: Recipe milk
    icon: mdi:cup
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 120
    step: 0.5
    update_interval: 1s
    lambda: |-
      auto v = id(machine).recipe_value(0x09);
      if (!v) return {};
      return *v / 10.0f;
    set_action:
      - lambda: 'id(machine).set_recipe_value(0x09, (uint16_t) (x * 10 + 0.5f));'
  - platform: template
    name: Autostart hour
    icon: mdi:alarm
    entity_category: config
    mode: box
    min_value: 0
    max_value: 23
    step: 1
    update_interval: 5s
    lambda: |-
      auto v = id(machine).param(64);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).write_param(64, (uint32_t) x);'
  - platform: template
    name: Autostart minute
    icon: mdi:alarm
    entity_category: config
    mode: box
    min_value: 0
    max_value: 59
    step: 1
    update_interval: 5s
    lambda: |-
      auto v = id(machine).param(65);
      if (!v) return {};
      return (float) *v;
    set_action:
      - lambda: 'id(machine).write_param(65, (uint32_t) x);'

