text_sensor:
  - platform: template
    name: State
    icon: mdi:coffee-maker
    update_interval: 1s
    lambda: 'return id(machine).state_text();'
  # What the running brew is doing: grinding, pre-infusion, extraction, milk, hot water, finishing, aborted.
  - platform: template
    name: Phase
    icon: mdi:progress-clock
    update_interval: 1s
    lambda: 'return id(machine).phase_text();'
  - platform: template
    name: Alarms
    icon: mdi:alert
    update_interval: 1s
    lambda: |-
      if (!id(machine).has_status()) return {"unknown"};
      return id(machine).alarms_text();
  - platform: template
    name: Accessory
    update_interval: 5s
    lambda: |-
      if (!id(machine).has_status()) return {"unknown"};
      return id(machine).accessory_text();
  # The machine's answer to the last brew sent from here: "03 accepted 01 00", "03 rejected ..." (the
  # bytes after 83 f0; the screen shows nothing for a remote start it refuses) or "03 no answer".
  # Published once per answer, so the same text twice is two answers.
  - platform: template
    name: Last brew
    icon: mdi:coffee-to-go
    entity_category: diagnostic
    update_interval: 200ms
    lambda: |-
      static uint32_t seen = 0;
      if (id(machine).brew_answers() == seen) return {};
      seen = id(machine).brew_answers();
      return id(machine).last_brew();
  - platform: template
    name: Favourites
    icon: mdi:star
    update_interval: 10s
    lambda: 'return id(machine).favorites_text();'
  - platform: template
    name: Custom drinks
    icon: mdi:coffee-to-go-outline
    update_interval: 10s
    lambda: 'return id(machine).custom_drinks_text();'
  # Bean Adapt slots set up on the machine (the select_bean_adapt action picks one; the machine does not
  # report which slot is active).
  - platform: template
    name: Bean slots
    icon: mdi:seed-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: 'return id(machine).bean_slots_text();'
  # Answer to the read_recipe / save_recipe actions.
  - platform: template
    name: Recipe
    icon: mdi:clipboard-text
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (id(machine).recipe_text().empty()) return {};
      return id(machine).recipe_text();
  # The machine's min-max per value of the drink in "Drink" (b0); edits are clamped to it.
  - platform: template
    name: Recipe limits
    icon: mdi:arrow-expand-horizontal
    update_interval: 1s
    lambda: |-
      auto t = id(machine).recipe_limits_text();
      if (t.empty()) return {};
      return t;
  # Device info, read when the machine comes online: PAR 205-209 serial number (4 ASCII bytes each),
  # 200-203 production date and 199 EEPROM version (shown raw), 210 the Bluetooth PIN.
  - platform: template
    name: Serial number
    icon: mdi:identifier
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      std::string out;
      for (int pid = 205; pid <= 209; pid++) {
        auto v = id(machine).param(pid);
        if (!v) return {};
        for (int shift = 24; shift >= 0; shift -= 8) {
          char c = (*v >> shift) & 0xFF;
          if (c > 0x20 && c < 0x7F) out += c;
        }
      }
      return out;
  - platform: template
    name: Production date
    icon: mdi:factory
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      std::string out;
      for (int pid = 200; pid <= 203; pid++) {
        auto v = id(machine).param(pid);
        if (!v) return {};
        if (!out.empty()) out += " ";
        out += to_string(*v);
      }
      return out;
  - platform: template
    name: EEPROM version
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto v = id(machine).param(199);
      if (!v) return {};
      return to_string(*v);
  - platform: template
    name: PIN
    icon: mdi:form-textbox-password
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
    lambda: |-
      auto v = id(machine).param(210);
      if (!v) return {};
      return to_string(*v);
  # Raw door/container switches (monitor bytes 1-2). "Insert X" on the display comes from here,
  # not from the alarm word.
  - platform: template
    name: Switches
    icon: mdi:electric-switch
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (!id(machine).has_status()) return {"unknown"};
      // Only bits 3 and 4 mean the same on every model seen; the app's names for the others (enum m6.p,
      // see docs/protocol.md) don't fit e.g. the ECAM450.65.G, so they show as bit numbers.
      uint16_t sw = id(machine).status().switches;
      std::string out;
      for (int i = 0; i < 16; i++)
        if (sw & (1 << i)) {
          if (!out.empty()) out += ", ";
          out += i == 3 ? "grounds container out" : i == 4 ? "tank out" : "bit " + to_string(i);
        }
      return out.empty() ? std::string("none") : out;

