  # Maintenance (found on an ECAM450.76.T, see docs/protocol.md): PAR 108 filters installed (confirmed:
  # +1 when a filter is set in the menu), PAR 105 descales and PAR 100 water since the last descale in
  # flow-meter pulses (25 per ml; presumed, not seen across a descale yet).
  - platform: template
