binary_sensor:
  # The machine answers the 0x75 monitor, standby included. Off, unplugged or a wiring fault
  # turns this off, and every other machine entity goes "unknown" until it answers again.
  - platform: template
    id: online
    name: Machine online
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(machine).has_status();'
    on_release:
      - lambda: |-
          for (auto *b : {id(ready), id(brewing), id(tank), id(grounds), id(descale), id(beans), id(drip_tray)})
            b->invalidate_state();
          for (auto *b : {id(tank_out), id(grounds_out)})
            b->invalidate_state();
          for (auto *s : {id(progress), id(water_total), id(milk_cleans), id(filters), id(water_since_filter), id(descales), id(water_since_descale), id(grounds_level)})
            s->publish_state(NAN);
    on_press:
      - lambda: 'id(machine).refresh(true);'
      - script.execute: sync_clock
      - delay: 2s
      - lambda: 'id(machine).read_recipe(ecam::Ecam::drink_id(std::string(id(drink).current_option())), 0);'
      - script.execute: read_counters
  - platform: template
    id: ready
    name: Ready
    lambda: |-
      if (!id(machine).has_status()) return {};
      return id(machine).idle() && id(machine).status().state == 0x07;
  - platform: template
    id: brewing
    name: Brewing
    lambda: |-
      if (!id(machine).has_status()) return {};
      return id(machine).brewing();
    on_release:
      - delay: 3s
      - script.execute: refresh_all
  # Statistics (A2) are only written when the machine goes to standby: read them then.
  - platform: template
    id: standby
    internal: true
    lambda: |-
      if (!id(machine).has_status()) return {};
      return id(machine).status().state == 0x00;
    on_press:
      - delay: 5s
      - script.execute: refresh_all
  - platform: template
    id: tank
    name: Water tank
    device_class: problem
    lambda: |-
      if (!id(machine).has_status()) return {};
      return (id(machine).status().alarms & ((1 << 0) | (1 << 13))) != 0;
  - platform: template
    id: tank_out
    name: Water tank removed
    device_class: problem
    lambda: |-
      if (!id(machine).has_status()) return {};
      return (id(machine).status().switches & (1 << 4)) != 0;
  - platform: template
    id: grounds_out
    name: Grounds container removed
    device_class: problem
    lambda: |-
      if (!id(machine).has_status()) return {};
      return (id(machine).status().switches & (1 << 3)) != 0;
  - platform: template
    id: grounds
    name: Grounds container full
    device_class: problem
    lambda: |-
      if (!id(machine).has_status()) return {};
      return (id(machine).status().alarms & (1 << 1)) != 0;
  - platform: template
    id: descale
    name: Descale needed
    device_class: problem
    lambda: |-
      if (!id(machine).has_status()) return {};
      return (id(machine).status().alarms & (1 << 2)) != 0;
  - platform: template
    id: beans
    name: Beans empty
    device_class: problem
    lambda: |-
      if (!id(machine).has_status()) return {};
      return id(machine).beans_empty();
  - platform: template
    id: drip_tray
    name: Drip tray
    device_class: problem
    lambda: |-
      if (!id(machine).has_status()) return {};
      return (id(machine).status().alarms & (1 << 11)) != 0;

script:
  - id: refresh_all
    then:
      - if:
          condition:
            lambda: 'return id(machine).has_status();'
          then:
            - lambda: 'id(machine).refresh(false);'
            - script.execute: read_counters
  - id: sync_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid() && id(machine).has_status()) id(machine).set_clock(now.hour, now.minute);
  - id: read_counters
    then:
      - lambda: |-
          // PAR 106: flowmeter count / 10; 25 pulses per ml (weighed 105 g for 2620 pulses).
          id(machine).read_param(106, [](uint32_t v) { id(water_total).publish_state(v * 10 / 25.0f / 1000.0f); });
          id(machine).read_param(115, [](uint32_t v) { id(milk_cleans).publish_state(v); });
          id(machine).read_param(108, [](uint32_t v) { id(filters).publish_state(v); });
          id(machine).read_param(109, [](uint32_t v) { id(water_since_filter).publish_state(v * 10 / 25.0f / 1000.0f); });
          id(machine).read_param(105, [](uint32_t v) { id(descales).publish_state(v); });
          id(machine).read_param(100, [](uint32_t v) { id(water_since_descale).publish_state(v / 25000.0f); });
          id(machine).read_param(101, [](uint32_t v) { id(grounds_level).publish_state(v); });

interval:
  - interval: ${ecam_poll_interval}
    then:
      - script.execute: refresh_all
