    id: progress
    name: Progress
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!id(machine).has_status()) return {};
      // An aborted brew reports 100 %; show 0 so it does not read as finished.
      auto &s = id(machine).status();
      return id(machine).brewing() && s.result != 0x01 ? (float) s.progress : 0.0f;
  # Counters, read after each drink, on standby and every ecam_poll_interval (PAR numbers as in the service menu).
